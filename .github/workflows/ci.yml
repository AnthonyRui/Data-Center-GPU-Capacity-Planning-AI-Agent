name: Validate model and tools / 验证模型与工具
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-agent-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_analysis.py --output-dir generated
      - run: python scripts/verify_notebooks.py
      - run: python run_agent.py --demo baseline
      - run: python run_agent.py --search-knowledge "What is PUE?" --json
